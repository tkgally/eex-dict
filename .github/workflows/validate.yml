# Repository checks for every pull request to main (and on demand).
# The job is named "validate": the merge procedure polls check runs by that name.
name: validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out (full history, for the diff against main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python3 -m unittest discover -s tools/tests -t .

      - name: Entry validation gate
        run: python3 tools/validate.py --gate

      - name: Word and line caps
        run: python3 tools/check_caps.py

      - name: Relative links
        run: python3 tools/check_links.py

      - name: Duplicate slugs
        run: |
          dups=$(find entries -type f -name '*.json' -exec basename {} \; | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "duplicate entry slugs (an entry lives in exactly one shard):"
            echo "$dups"
            exit 1
          fi
          echo "no duplicate slugs"

      - name: docs/ is never committed by a PR
        run: |
          git fetch origin main
          changed=$(git diff --name-only origin/main...HEAD | grep '^docs/' || true)
          if [ -n "$changed" ]; then
            echo "docs/ is generated by the site workflow and must not be in a pull request:"
            echo "$changed"
            exit 1
          fi
          echo "docs/ untouched"

      - name: sources/ holds markdown only
        run: |
          stray=$(find sources -type f ! -name '*.md' ! -name '.gitkeep')
          if [ -n "$stray" ]; then
            echo "sources/ may hold only markdown (wiki/conventions.md section 6):"
            echo "$stray"
            exit 1
          fi
          echo "sources/ is markdown only"

      # Added when those tools land:
